<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#f2ede4" />
    <title>Sugar.no Scanner is offline</title>
    <style>
      body { min-height: 100vh; margin: 0; display: grid; place-items: center; padding: 24px; box-sizing: border-box; background: #f2ede4; color: #111; font: 16px/1.5 system-ui, sans-serif; }
      main { width: min(100%, 420px); padding: 28px; border-radius: 24px; background: #fffdf8; }
      h1 { margin: 12px 0; font-size: 36px; line-height: 1; }
      p { color: #655d55; }
      button { min-height: 48px; padding: 10px 18px; border: 0; border-radius: 13px; background: #111; color: #fff; font: inherit; font-weight: 700; }
    </style>
  </head>
  <body>
    <main>
      <strong>Sugar<span style="color:#e8614a">.no</span></strong>
      <h1>Recognition is paused.</h1>
      <p>The camera can stay private, but product matching needs a connection.</p>
      <button onclick="location.reload()">Try again</button>
    </main>
  </body>
</html>
