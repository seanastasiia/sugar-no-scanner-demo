name: Codex apply verified scanner release

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Apply verified patch and remove this workflow
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/sugar-no-release.patch.gz.b64 <<'PATCH_B64'
          
          PATCH_B64
          base64 -d /tmp/sugar-no-release.patch.gz.b64 > /tmp/sugar-no-release.patch.gz
          gzip -dc /tmp/sugar-no-release.patch.gz > /tmp/sugar-no-release.patch
          git apply --3way /tmp/sugar-no-release.patch
          git rm .github/workflows/codex-apply.yml
          git add -A
          git config user.name 'Codex release bot'
          git config user.email 'codex@users.noreply.github.com'
          git commit -m 'Add Latvia shelf benchmark and rated overlays'
          git push origin HEAD:main
